name: CI

# Validação automática a cada push no main e em todo pull request.
# Roda lint + type-check + vitest + build. Playwright E2E ainda
# não existe; entra quando vir benefício.

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs anteriores do mesmo PR quando vem novo push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint + Type-check + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Variáveis fake pra o build do Next achar — não são usadas no CI.
      # Os endpoints reais ficam protegidos pelas envs da Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint de timestamps duplicados de migration (auditoria 4.2).
      # Convenção: cada migration tem um prefixo de 14 chars ÚNICO; o
      # Supabase CLI ordena por nome, então duplicar a data deixa a ordem
      # à mercê do sufixo (frágil). Ver docs/milsaca/convencao-migrations.md.
      #
      # Allowlist: 5 pares já aplicados no remoto ANTES da convenção (não
      # podem ser renomeados). Qualquer prefixo duplicado NOVO falha o job.
      - name: Lint migrations (timestamp único)
        run: |
          cd supabase/migrations
          allow="20260528000000 20260529000000 20260530000000 20260531000000 20260601000000"
          dup=$(ls *.sql | cut -c1-14 | sort | uniq -d)
          bad=""
          for d in $dup; do
            case " $allow " in
              *" $d "*) echo "::warning::timestamp duplicado conhecido (allowlist): $d" ;;
              *) bad="$bad $d" ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "::error::timestamps de migration duplicados (não permitidos):$bad"
            echo "Use um timestamp único. Ver docs/milsaca/convencao-migrations.md."
            exit 1
          fi
          echo "OK: nenhum timestamp duplicado fora da allowlist."

      - name: Lint
        run: pnpm -w lint

      - name: Type-check
        run: pnpm -w type-check

      - name: Unit tests
        run: pnpm -w test

      - name: Build (web)
        run: pnpm --filter @milsaca/web build

      # Mobile build real só roda via EAS (cloud), mas expo-doctor pega
      # regressões de config local (app.json, deps incompatíveis, etc).
      # continue-on-error: doctor às vezes alerta sobre versões mismatch
      # que não bloqueiam build — não queremos quebrar PR por warning.
      - name: Expo doctor (mobile)
        run: pnpm --filter @milsaca/mobile exec npx expo-doctor
        continue-on-error: true
