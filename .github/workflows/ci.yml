name: CI

# Validação automática a cada push no main e em todo pull request.
# Roda lint + type-check + vitest + build. Playwright E2E ainda
# não existe; entra quando vir benefício.

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs anteriores do mesmo PR quando vem novo push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint + Type-check + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Variáveis fake pra o build do Next achar — não são usadas no CI.
      # Os endpoints reais ficam protegidos pelas envs da Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -w lint

      - name: Type-check
        run: pnpm -w type-check

      - name: Unit tests
        run: pnpm -w test

      - name: Build (web)
        run: pnpm --filter @milsaca/web build
