<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Milsaca</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf7f0;
        color: #0f3d2e;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .dot {
        width: 56px;
        height: 56px;
        border-radius: 9999px;
        background: #efeadb;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 16px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #4a5c4c; margin: 0 0 20px; }
      button {
        background: #1b5e3f;
        color: #faf7f0;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">☕</div>
      <h1>Você está sem conexão</h1>
      <p>
        Não foi possível atualizar agora. Quando você já tiver aberto seu painel,
        mostramos o último estado salvo. Assim que o sinal voltar, tudo
        sincroniza sozinho.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
